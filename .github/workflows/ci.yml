name: CI

on:
  push:
    branches: ['main']
    tags: ['v*']
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    name: Node ${{ matrix.node }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [20, 22, 24]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - name: Install (no dependencies, verifies lockfile)
        run: npm ci --ignore-scripts

      - name: Lint
        run: npm run lint

      - name: Build/package check
        run: npm run build

      - name: Test
        run: npm test

      - name: Report versions
        run: node --version && npm --version
